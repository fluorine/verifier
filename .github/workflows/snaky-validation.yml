name: Snaky statement validation
on:
  push:
    branches: [validation-snaky-statement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'fluorine/verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 70a07664b8387de861a0f3a20997e44ec96253a1
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz' | sha256sum --check
          mkdir /tmp/elan-installer
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-installer
          /tmp/elan-installer/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source controls and Lean kernel checks
        run: python3 auto-research/lean-statements/2026-10-25-fluorine-snaky-move-bound/verify.py --lean

